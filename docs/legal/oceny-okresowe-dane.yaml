  rozmowa_rozpoczynajaca_po_ocenie_negatywnej: { wartosc: 7, jednostka: dni, podstawa: "§ 7 pkt 2" }
  ponowna_ocena_po_negatywnej: { wartosc: 6, jednostka: miesiace, od: "zapoznanie z oceną", podstawa: "art. 81 ust. 9" }
  przedluzenie_o_nieobecnosc: { prog_nieobecnosci: "dłużej niż miesiąc", rodzaj: usprawiedliwiona, podstawa: "art. 81 ust. 7" }
  minimalny_okres_do_zmiany_terminu_lub_oceny_przy_zmianie_stanowiska: { wartosc: 6, jednostka: miesiace, podstawa: "art. 81 ust. 6 i 8" }
  ocena_przy_zmianie_stanowiska_okno: { przed_dni: 7, po_dni: 30, podstawa: "§ 9 ust. 2" }
  ponowne_ustalenie_kryteriow_po_zmianie_stanowiska_w_6_mies: { wartosc: 30, jednostka: dni, termin_oceny_bez_zmian: true, podstawa: "§ 9 ust. 1" }
  sprzeciw: { wartosc: 7, jednostka: dni, od: "zapoznanie z oceną", podstawa: "art. 83 ust. 1" }
  rozpatrzenie_sprzeciwu: { wartosc: 14, jednostka: dni, od: "wniesienie", podstawa: "art. 83 ust. 3" }
  odwolanie_do_sadu_pracy: { wartosc: 14, jednostka: dni, od: "doręczenie decyzji albo upływ terminu rozpatrzenia", podstawa: "art. 83 ust. 5" }
  kolejny_stopien_z_mocy_prawa: { wartosc: 30, jednostka: dni, od: "zapoznanie z oceną", warunek: "dwie kolejne pozytywne na jednym z dwóch najwyższych poziomów od ostatniego stopnia", podstawa: "art. 89 ust. 2" }

powody_zmiany_terminu:
  podstawa: "art. 81 ust. 8"
  lista:
    - zmiana_oceniajacego
    - przewidywana_dluzsza_nieobecnosc_ocenianego
    - przewidywana_dluzsza_nieobecnosc_oceniajacego
    - wniosek_ocenianego
  wymaga_pisemnego_zawiadomienia: true   # § 8, kopia do arkusza

