name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm check
        env:
          TURBO_CACHE_DIR: .turbo/cache
          # Type-aware ESLint over the whole monorepo needs more than Node's default heap on the runner (7 GB RAM).
          NODE_OPTIONS: --max-old-space-size=6144

  baza:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v7
      # The Supabase CLI comes from the @sarmata/database devDependency (pinned in the lockfile), same as locally.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # Same state as `pnpm db:reset` locally: official regulation versions synced from backend/regulations.
      - name: Synchronizacja przepisów
        working-directory: .
        run: pnpm regulations:sync
      - run: pnpm exec supabase test db
      - name: Typy zgodne z migracjami
        run: |
          pnpm exec supabase gen types typescript --schema public > /tmp/types.ts
          diff -u src/types.ts /tmp/types.ts

  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Supabase CLI comes from the @sarmata/database devDependency, same as locally and in the baza job.
      - name: Supabase (db, auth, rest)
        working-directory: database
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # Same state as `pnpm db:reset` locally: synced regulations and demo evaluations created through the services.
      - run: pnpm regulations:sync
      - run: pnpm db:seed:demo
      - run: pnpm web:env
      - run: pnpm --filter @sarmata/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @sarmata/web build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
